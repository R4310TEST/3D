
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>R4310 - PRINTFLOW 3D</title>
<style>
:root {
  --bg:#090d12;
  --panel:#111820;
  --panel2:#151f29;
  --border:#283642;
  --text:#e7f0f5;
  --muted:#8294a2;
  --green:#39f59a;
  --green2:#16c978;
  --red:#ff626e;
  --yellow:#ffc857;
  --left:210px;
  --hour:64px;
}
* { box-sizing:border-box; }
body {
  margin:0; background:var(--bg); color:var(--text);
  font-family:Inter,Segoe UI,Arial,sans-serif;
}
button,input,select { font:inherit; }
button {
  border:1px solid var(--border); border-radius:8px;
  padding:9px 13px; background:var(--panel2);
  color:var(--text); cursor:pointer;
}
button:hover { border-color:var(--green); }
.topbar {
  height:76px; display:flex; align-items:center; justify-content:space-between;
  gap:18px; padding:0 24px; border-bottom:1px solid var(--border);
  background:#0b1117; position:sticky; top:0; z-index:100;
}
.brand { display:flex; align-items:center; gap:12px; }
.brand-mark {
  width:42px; height:42px; border:1px solid var(--green);
  border-radius:10px; display:grid; place-items:center;
  color:var(--green); font-weight:900; font-size:17px;
  box-shadow:0 0 18px #39f59a24;
}
.brand-name { color:var(--green); font-weight:900; letter-spacing:1.3px; }
.brand-sub { color:var(--muted); font-size:10px; letter-spacing:2px; margin-top:4px; }
.nav { display:flex; gap:8px; }
.nav button.active { background:#143427; border-color:var(--green); color:var(--green); }
main { padding:20px; }
.page { display:none; }
.page.active { display:block; }
.toolbar {
  display:flex; flex-wrap:wrap; align-items:center; gap:9px;
  margin-bottom:15px;
}
.toolbar h2 { margin:0 auto 0 0; font-size:19px; }
.clock-pill {
  border:1px solid #246c4b; background:#0d281d; color:var(--green);
  border-radius:8px; padding:10px 13px; font-variant-numeric:tabular-nums;
}
.primary { background:#123d2a; border-color:#218c5a; color:var(--green); }
.danger { color:var(--red); }
.calendar-wrapper {
  border:1px solid var(--border); border-radius:12px;
  overflow:auto; height:calc(100vh - 175px); min-height:400px;
  background:#0b1117; position:relative; scrollbar-color:#344a58 #0b1117;
}
.calendar { width:max-content; min-width:100%; }
.calendar-header,.printer-row {
  display:flex; width:max-content; min-width:100%;
}
.calendar-header {
  position:sticky; top:0; z-index:30; background:#111a23;
  border-bottom:1px solid var(--border);
}
.corner {
  width:var(--left); min-width:var(--left); height:88px;
  position:sticky; left:0; z-index:35; background:#111a23;
  border-right:1px solid var(--border);
  display:flex; flex-direction:column; justify-content:space-between;
  padding:13px 14px;
}
/* Sol üst köşede artık çapraz çizgi yok */
.corner-time { font-size:11px; color:var(--muted); letter-spacing:1px; }
.corner-printers { color:var(--green); font-weight:800; font-size:12px; letter-spacing:1.5px; }
.timeline-header { display:flex; }
.day-group { width:calc(var(--hour) * 24); flex-shrink:0; }
.day-label {
  height:38px; display:flex; align-items:center; padding-left:12px;
  border-right:1px solid var(--border); border-bottom:1px solid var(--border);
  font-size:12px; color:#cbd9e2; font-weight:700;
}
.hours { display:flex; height:50px; }
.hour-label {
  width:var(--hour); min-width:var(--hour); flex-shrink:0;
  display:grid; place-items:center; font-size:10px; color:var(--muted);
  border-right:1px solid #1e2b36;
}
.printer-name {
  width:var(--left); min-width:var(--left); position:sticky; left:0;
  z-index:15; padding:14px; background:#101821;
  border-right:1px solid var(--border); border-bottom:1px solid var(--border);
  display:flex; flex-direction:column; gap:8px;
}
.printer-name strong { font-size:13px; }
.printer-name small { color:var(--muted); font-size:10px; }
.printer-actions { display:flex; gap:5px; flex-wrap:wrap; }
.printer-actions button { font-size:10px; padding:5px 7px; }
.status-dot {
  display:inline-block; width:7px; height:7px; border-radius:50%;
  background:var(--green); margin-right:6px;
}
.status-dot.fault { background:var(--red); }
.status-dot.maintenance { background:var(--yellow); }
.timeline {
  height:82px; display:flex; position:relative;
  border-bottom:1px solid var(--border); background:#0b1219;
}
.hour-cell {
  width:var(--hour); min-width:var(--hour); flex-shrink:0;
  border-right:1px solid #1c2933; position:relative; cursor:pointer;
}
.hour-cell.workhour { background:#39f59a0a; }
.hour-cell.weekend { background:#9aa9b50c; }
.hour-cell:hover { background:#39f59a19; }
.job {
  position:absolute; top:10px; height:61px; z-index:8;
  border:1px solid #239a65; border-radius:7px;
  background:linear-gradient(110deg,#123b2b,#145438);
  overflow:hidden; cursor:pointer; min-width:8px;
  box-shadow:0 3px 10px #0004;
}
.job::before {
  content:""; position:absolute; inset:0 auto 0 0; width:var(--progress,0%);
  background:#39f59a22; pointer-events:none;
}
.job-content {
  position:relative; z-index:2; padding:7px 9px;
  height:100%; display:flex; flex-direction:column; justify-content:center;
  white-space:nowrap; overflow:hidden;
}
.job-title { color:#eafff4; font-size:11px; font-weight:800; overflow:hidden; text-overflow:ellipsis; }
.job-meta { font-size:10px; color:#9ee9c2; margin-top:4px; }
.job.running { border-color:var(--green); box-shadow:0 0 12px #39f59a22; }
.job.running::after {
  content:""; position:absolute; inset:0; pointer-events:none;
  background:linear-gradient(100deg,transparent,#39f59a18,transparent);
  animation:flow 2.5s linear infinite;
}
@keyframes flow { from { transform:translateX(-100%); } to { transform:translateX(100%); } }
.now-line {
  position:absolute; top:0; bottom:0; width:2px; background:var(--green);
  z-index:12; pointer-events:none; box-shadow:0 0 8px #39f59a;
}
.now-line::before {
  content:"ŞİMDİ"; position:absolute; top:0; left:4px;
  color:#08130d; background:var(--green); font-size:9px; font-weight:900;
  padding:3px 5px; border-radius:0 0 4px 4px; white-space:nowrap;
}
.blocked {
  position:absolute; inset:0; z-index:5; background:#ff626e12;
  border:1px dashed #ff626e77; pointer-events:none;
}
.blocked.maintenance { background:#ffc85710; border-color:#ffc85777; }
.section-title { font-size:18px; margin:4px 0 17px; }
.cards {
  display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:15px; align-items:stretch;
}
.card {
  background:var(--panel); border:1px solid var(--border);
  border-radius:12px; padding:17px; min-width:0;
}
.card h3 { font-size:13px; color:var(--muted); margin:0 0 13px; }
.card-value { font-size:28px; color:var(--green); font-weight:850; }
.card p { font-size:12px; color:var(--muted); line-height:1.5; }
.printer-card { min-height:190px; }
.printer-card .card-value { font-size:20px; }
.card-top { display:flex; justify-content:space-between; gap:8px; align-items:center; }
.tag { font-size:10px; border-radius:20px; padding:5px 8px; background:#153b2b; color:var(--green); }
.tag.fault { background:#401d23; color:var(--red); }
.tag.maintenance { background:#40351a; color:var(--yellow); }
.job-list { display:grid; gap:8px; }
.job-list-item {
  padding:12px; border:1px solid var(--border); border-radius:8px;
  background:#0d141b; display:flex; justify-content:space-between; gap:10px;
  font-size:12px;
}
.empty { color:var(--muted); font-size:12px; padding:10px 0; }
.modal-backdrop {
  display:none; position:fixed; inset:0; z-index:200;
  background:#000a; align-items:center; justify-content:center; padding:15px;
}
.modal-backdrop.open { display:flex; }
.modal {
  width:min(520px,100%); max-height:90vh; overflow:auto;
  background:#101820; border:1px solid var(--border); border-radius:14px; padding:21px;
}
.modal h2 { font-size:18px; margin:0 0 18px; }
.field { display:grid; gap:7px; margin-bottom:13px; }
.field label { color:var(--muted); font-size:11px; }
.field input,.field select {
  width:100%; background:#0a1117; border:1px solid var(--border);
  border-radius:8px; color:var(--text); padding:11px;
}
.modal-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:18px; }
@media(max-width:700px) {
  :root { --left:155px; --hour:54px; }
  .topbar { padding:0 12px; height:68px; }
  .brand-mark { width:35px; height:35px; }
  .brand-name { font-size:11px; }
  .brand-sub { font-size:8px; }
  .nav button { padding:8px; font-size:11px; }
  main { padding:12px; }
  .calendar-wrapper { height:calc(100vh - 160px); }
  .corner { height:82px; padding:10px; }
  .printer-name { padding:10px 8px; }
  .printer-name strong { font-size:11px; }
  .cards { grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; }
  .card { padding:12px; }
  .card-value { font-size:23px; }
}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="brand-mark">R4</div>
    <div>
      <div class="brand-name">R4310 - PRINTFLOW 3D</div>
      <div class="brand-sub">PRODUCTION CONTROL SYSTEM</div>
    </div>
  </div>
  <nav class="nav">
    <button id="calendarTab" class="active" onclick="showPage('calendar')">Üretim Takvimi</button>
    <button id="dashboardTab" onclick="showPage('dashboard')">Dashboard</button>
  </nav>
</header>

<main>
  <section id="calendarPage" class="page active">
    <div class="toolbar">
      <h2>Üretim Takvimi</h2>
      <div class="clock-pill" id="liveClock">--:--:--</div>
      <button onclick="shiftCalendar(-1)">← Önceki</button>
      <button onclick="goToNow()">Şimdiki Saat</button>
      <button onclick="shiftCalendar(1)">Sonraki →</button>
      <button onclick="changeZoom(-8)">−</button>
      <button onclick="changeZoom(8)">+</button>
      <button class="primary" onclick="openJobModal()">+ Baskı Ekle</button>
    </div>
    <div class="calendar-wrapper" id="calendarWrapper">
      <div class="calendar" id="calendar">
        <div class="calendar-header">
          <div class="corner">
            <div class="corner-time">TARİH / SAAT</div>
            <div class="corner-printers">YAZICILAR</div>
          </div>
          <div class="timeline-header" id="timelineHeader"></div>
        </div>
        <div id="calendarRows"></div>
      </div>
    </div>
  </section>

  <section id="dashboardPage" class="page">
    <div class="toolbar">
      <h2>Üretim Dashboard</h2>
      <button onclick="renderDashboard()">↻ Yenile</button>
      <button class="primary" onclick="openPrinterModal()">+ Yazıcı Ekle</button>
    </div>
    <div class="cards" id="summaryCards"></div>
    <h3 class="section-title" style="margin-top:24px">Yazıcı Durumları</h3>
    <div class="cards" id="printerCards"></div>
    <div class="cards" style="margin-top:20px">
      <div class="card">
        <h3>Basılacak İşler</h3>
        <div id="savedJobsList" class="job-list"></div>
        <button style="margin-top:12px" onclick="openSavedJobModal()">+ İş Kaydet</button>
      </div>
      <div class="card">
        <h3>Aktif Baskılar</h3>
        <div id="activeJobsList" class="job-list"></div>
      </div>
      <div class="card">
        <h3>Tamamlanan Baskılar</h3>
        <div id="completedJobsList" class="job-list"></div>
      </div>
    </div>
  </section>
</main>

<div class="modal-backdrop" id="modalBackdrop" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <h2 id="modalTitle">İşlem</h2>
    <div id="modalBody"></div>
    <div class="modal-actions">
      <button onclick="closeModal()">İptal</button>
      <button class="primary" id="modalSave">Kaydet</button>
    </div>
  </div>
</div>

<script>
const HOUR = 3600000;
const DAY = 24 * HOUR;
let zoom = 64;
let calendarStart = new Date();
calendarStart.setHours(0,0,0,0);

let printers = [
  {id:1,name:"R4310 - 01",status:"ready",note:""},
  {id:2,name:"R4310 - 02",status:"ready",note:""},
  {id:3,name:"R4310 - 03",status:"ready",note:""},
  {id:4,name:"R4310 - 04",status:"ready",note:""}
];
let jobs = [];
let savedJobs = [];
let statuses = [];
let nextId = 1;
let modalSaveAction = null;

const $ = id => document.getElementById(id);
const fmtDate = d => d.toLocaleDateString("tr-TR",{day:"2-digit",month:"2-digit"});
const fmtDateTime = d => d.toLocaleString("tr-TR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function showPage(page) {
  $("calendarPage").classList.toggle("active",page==="calendar");
  $("dashboardPage").classList.toggle("active",page==="dashboard");
  $("calendarTab").classList.toggle("active",page==="calendar");
  $("dashboardTab").classList.toggle("active",page==="dashboard");
  if(page==="calendar") setTimeout(goToNow,50);
  if(page==="dashboard") renderDashboard();
}

function changeZoom(delta) {
  zoom = Math.max(32,Math.min(100,zoom+delta));
  document.documentElement.style.setProperty("--hour",zoom+"px");
  renderCalendar();
  setTimeout(goToNow,30);
}
function shiftCalendar(days) {
  calendarStart = new Date(calendarStart.getTime()+days*DAY);
  renderCalendar();
}
function goToNow() {
  const wrapper = $("calendarWrapper");
  const now = Date.now();
  const x = (now-calendarStart.getTime())/HOUR*zoom;
  // Şimdiki saat çizgisini ekranın ortasına yakın getirir.
  wrapper.scrollLeft = Math.max(0,x-wrapper.clientWidth*0.45);
}
function updateClock() {
  $("liveClock").textContent = new Date().toLocaleTimeString("tr-TR");
}
function statusAt(printerId,time) {
  return statuses.find(s=>s.printerId===printerId &&
    time>=s.start && (s.end===null || time<s.end));
}
function jobConflict(printerId,start,end,ignoreId=null) {
  return jobs.some(j=>j.printerId===printerId && j.id!==ignoreId &&
    start<j.end && end>j.start);
}
function renderCalendar() {
  const header = $("timelineHeader");
  const rows = $("calendarRows");
  header.innerHTML = "";
  rows.innerHTML = "";
  const days = 30;
  const start = calendarStart.getTime();

  for(let d=0;d<days;d++) {
    const date = new Date(start+d*DAY);
    const group = document.createElement("div");
    group.className = "day-group";
    const label = document.createElement("div");
    label.className = "day-label";
    label.textContent = date.toLocaleDateString("tr-TR",{weekday:"short",day:"2-digit",month:"short"});
    group.appendChild(label);
    const hours = document.createElement("div");
    hours.className = "hours";
    for(let h=0;h<24;h++) {
      const cell = document.createElement("div");
      cell.className = "hour-label";
      cell.textContent = String(h).padStart(2,"0")+":00";
      hours.appendChild(cell);
    }
    group.appendChild(hours);
    header.appendChild(group);
  }

  printers.forEach(printer=>{
    const row = document.createElement("div");
    row.className = "printer-row";
    const name = document.createElement("div");
    name.className = "printer-name";
    const currentStatus = statusAt(printer.id,Date.now());
    const labelStatus = currentStatus ? currentStatus.type : printer.status;
    const dotClass = labelStatus==="fault"?"fault":labelStatus==="maintenance"?"maintenance":"";
    name.innerHTML = `<strong><span class="status-dot ${dotClass}"></span>${esc(printer.name)}</strong>
      <small>${labelStatus==="fault"?"ARIZALI":labelStatus==="maintenance"?"BAKIMDA":labelStatus==="ready"?"HAZIR":"AKTİF"}</small>
      <div class="printer-actions">
        <button onclick="editPrinter(${printer.id})">Düzenle</button>
        <button onclick="setPrinterStatus(${printer.id})">Durum</button>
      </div>`;
    row.appendChild(name);

    const timeline = document.createElement("div");
    timeline.className = "timeline";
    timeline.style.width = (days*24*zoom)+"px";
    for(let d=0;d<days;d++) {
      const date = new Date(start+d*DAY);
      for(let h=0;h<24;h++) {
        const cell = document.createElement("div");
        cell.className = "hour-cell";
        const dow = date.getDay();
        if(dow===0||dow===6) cell.classList.add("weekend");
        else if(h>=8&&h<16) cell.classList.add("workhour");
        cell.onclick = ()=>openJobModal(printer.id,new Date(start+(d*24+h)*HOUR));
        timeline.appendChild(cell);
      }
    }

    // Bakım ve arıza zaman blokları
    statuses.filter(s=>s.printerId===printer.id).forEach(s=>{
      const end = s.end===null ? start+days*DAY : s.end;
      const left = (s.start-start)/HOUR*zoom;
      const right = (end-start)/HOUR*zoom;
      if(right<=0||left>=days*24*zoom) return;
      const block = document.createElement("div");
      block.className = "blocked "+(s.type==="maintenance"?"maintenance":"");
      block.style.left = Math.max(0,left)+"px";
      block.style.width = Math.max(2,Math.min(days*24*zoom,right)-Math.max(0,left))+"px";
      block.title = (s.type==="fault"?"Arıza":"Bakım")+(s.note?": "+s.note:"");
      timeline.appendChild(block);
    });

    // Baskı blokları
    jobs.filter(j=>j.printerId===printer.id).forEach(job=>{
      const left = (job.start-start)/HOUR*zoom;
      const width = (job.end-job.start)/HOUR*zoom;
      if(left+width<0||left>days*24*zoom) return;
      const jobEl = document.createElement("div");
      const now = Date.now();
      const progress = Math.max(0,Math.min(100,(now-job.start)/(job.end-job.start)*100));
      const running = now>=job.start&&now<job.end;
      jobEl.className = "job"+(running?" running":"");
      jobEl.style.left = Math.max(0,left)+"px";
      jobEl.style.width = Math.max(12,Math.min(days*24*zoom,left+width)-Math.max(0,left))+"px";
      jobEl.style.setProperty("--progress",progress+"%");
      jobEl.title = `${job.name} · ${fmtDateTime(new Date(job.start))} – ${fmtDateTime(new Date(job.end))}`;
      jobEl.innerHTML = `<div class="job-content"><div class="job-title">${esc(job.name)}</div>
        <div class="job-meta">${running?Math.floor(progress)+"% · Baskıda":progress>=100?"Tamamlandı":fmtDateTime(new Date(job.start))}</div></div>`;
      jobEl.onclick = e=>{e.stopPropagation();if(confirm(`"${job.name}" baskısını silmek istiyor musun?`)){jobs=jobs.filter(j=>j.id!==job.id);renderAll();}};
      timeline.appendChild(jobEl);
    });

    // Şimdiki saat çizgisi: her yazıcı satırında görünür.
    const nowX = (Date.now()-start)/HOUR*zoom;
    if(nowX>=0&&nowX<=days*24*zoom) {
      const line = document.createElement("div");
      line.className = "now-line";
      line.style.left = nowX+"px";
      timeline.appendChild(line);
    }
    row.appendChild(timeline);
    rows.appendChild(row);
  });
}
function openModal(title,body,saveAction) {
  $("modalTitle").textContent=title;
  $("modalBody").innerHTML=body;
  modalSaveAction=saveAction;
  $("modalBackdrop").classList.add("open");
  $("modalSave").onclick=()=>{if(modalSaveAction)modalSaveAction();};
}
function closeModal() {$("modalBackdrop").classList.remove("open");modalSaveAction=null;}

function openJobModal(printerId=null,date=null) {
  const startDate = date || new Date(Date.now()+15*60000);
  startDate.setSeconds(0,0);
  const defaultDate = new Date(startDate.getTime()-startDate.getTimezoneOffset()*60000).toISOString().slice(0,16);
  const printerOptions=printers.map(p=>`<option value="${p.id}" ${p.id===printerId?"selected":""}>${esc(p.name)}</option>`).join("");
  const savedOptions=savedJobs.map(j=>`<option value="${j.id}">${esc(j.name)} (${j.duration} saat)</option>`).join("");
  openModal("Takvime Baskı Ekle",`
    <div class="field"><label>Kaydedilmiş iş (isteğe bağlı)</label><select id="savedSelect"><option value="">Yeni iş gir</option>${savedOptions}</select></div>
    <div class="field"><label>Baskı adı</label><input id="jobName" placeholder="Örn. Parça A-103" required></div>
    <div class="field"><label>Yazıcı</label><select id="jobPrinter">${printerOptions}</select></div>
    <div class="field"><label>Başlangıç tarihi ve saati</label><input id="jobStart" type="datetime-local" value="${defaultDate}" required></div>
    <div class="field"><label>Süre (saat)</label><input id="jobDuration" type="number" min="0.1" step="0.1" value="2" required></div>
    <p style="font-size:11px;color:var(--muted)">Gece yarısını geçen baskılar otomatik olarak devam eder.</p>`,
    ()=>{
      const savedId=Number($("savedSelect").value);
      const saved=savedJobs.find(j=>j.id===savedId);
      const name=$("jobName").value.trim()||(saved?saved.name:"");
      const pid=Number($("jobPrinter").value);
      const start=new Date($("jobStart").value).getTime();
      const duration=Number($("jobDuration").value);
      if(!name||!Number.isFinite(start)||!duration||duration<=0){alert("Lütfen iş adı, başlangıç ve geçerli süre gir.");return;}
      const end=start+duration*HOUR;
      if(jobConflict(pid,start,end)){alert("Bu yazıcıda seçilen zaman aralığı başka bir baskıyla çakışıyor.");return;}
      const blocked=statuses.some(s=>s.printerId===pid&&start<(s.end??Infinity)&&end>s.start);
      if(blocked){alert("Bu yazıcı seçilen zaman aralığında arıza veya bakım nedeniyle kullanılamıyor.");return;}
      jobs.push({id:nextId++,name,printerId:pid,start,end});
      closeModal();renderAll();
    });
  $("savedSelect").onchange=()=>{
    const j=savedJobs.find(x=>x.id===Number($("savedSelect").value));
    if(j){$("jobName").value=j.name;$("jobDuration").value=j.duration;}
  };
}
function openSavedJobModal() {
  openModal("İş Kaydet",`
    <div class="field"><label>İş / parça adı</label><input id="savedName" placeholder="Örn. Kapak V2"></div>
    <div class="field"><label>Tahmini baskı süresi (saat)</label><input id="savedDuration" type="number" min="0.1" step="0.1" value="2"></div>
    <p style="font-size:11px;color:var(--muted)">Bu işlem işi yalnızca listeye kaydeder; takvime otomatik eklemez.</p>`,
    ()=>{
      const name=$("savedName").value.trim(),duration=Number($("savedDuration").value);
      if(!name||!duration||duration<=0){alert("İş adı ve geçerli süre gir.");return;}
      savedJobs.push({id:nextId++,name,duration});
      closeModal();renderDashboard();
    });
}
function openPrinterModal(printer=null) {
  openModal(printer?"Yazıcıyı Düzenle":"Yeni Yazıcı",`
    <div class="field"><label>Yazıcı adı</label><input id="printerName" value="${esc(printer?.name||"")}" placeholder="Örn. R4310 - 05"></div>`,
    ()=>{
      const name=$("printerName").value.trim();
      if(!name){alert("Yazıcı adı gir.");return;}
      if(printer)printer.name=name;
      else printers.push({id:nextId++,name,status:"ready",note:""});
      closeModal();renderAll();
    });
}
function editPrinter(id) {openPrinterModal(printers.find(p=>p.id===id));}
function setPrinterStatus(id) {
  const p=printers.find(p=>p.id===id);
  openModal("Yazıcı Durumu",`
    <div class="field"><label>Durum</label><select id="statusType">
      <option value="ready">Hazır / Engeli kaldır</option>
      <option value="fault">Arıza</option>
      <option value="maintenance">Bakım</option>
    </select></div>
    <div class="field"><label>Başlangıç</label><input id="statusStart" type="datetime-local" value="${new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16)}"></div>
    <div class="field"><label>Bitiş (boş bırakılırsa süresiz)</label><input id="statusEnd" type="datetime-local"></div>
    <div class="field"><label>Açıklama</label><input id="statusNote" placeholder="Arıza / bakım notu"></div>`,
    ()=>{
      const type=$("statusType").value;
      if(type==="ready"){statuses=statuses.filter(s=>s.printerId!==id);p.status="ready";}
      else {
        const start=new Date($("statusStart").value).getTime();
        const endValue=$("statusEnd").value;
        const end=endValue?new Date(endValue).getTime():null;
        if(!Number.isFinite(start)||(end!==null&&(!Number.isFinite(end)||end<=start))){alert("Tarihleri kontrol et.");return;}
        statuses.push({id:nextId++,printerId:id,type,start,end,note:$("statusNote").value.trim()});
        p.status=type;
      }
      closeModal();renderAll();
    });
}
function renderDashboard() {
  const now=Date.now();
  const active=jobs.filter(j=>j.start<=now&&j.end>now);
  const completed=jobs.filter(j=>j.end<=now);
  const upcoming=jobs.filter(j=>j.start>now).sort((a,b)=>a.start-b.start);
  const blockedPrinters=printers.filter(p=>statusAt(p.id,now));
  const idle=printers.filter(p=>!statusAt(p.id,now)&&!active.some(j=>j.printerId===p.id));
  $("summaryCards").innerHTML=`
    <div class="card"><h3>Toplam Yazıcı</h3><div class="card-value">${printers.length}</div><p>Tanımlı üretim yazıcısı</p></div>
    <div class="card"><h3>Baskıda</h3><div class="card-value">${active.length}</div><p>Şu anda çalışan işler</p></div>
    <div class="card"><h3>Boşta Yazıcı</h3><div class="card-value">${idle.length}</div><p>İşi ve bakım engeli olmayan</p></div>
    <div class="card"><h3>Arıza / Bakım</h3><div class="card-value">${blockedPrinters.length}</div><p>Kullanıma kapalı yazıcı</p></div>`;
  $("printerCards").innerHTML=printers.map(p=>{
    const status=statusAt(p.id,now);
    const activeJob=active.find(j=>j.printerId===p.id);
    const next=upcoming.find(j=>j.printerId===p.id);
    const type=status?status.type:p.status;
    const tag=type==="fault"?"fault":type==="maintenance"?"maintenance":"";
    const label=type==="fault"?"ARIZALI":type==="maintenance"?"BAKIMDA":activeJob?"BASKIDA":"HAZIR";
    const progress=activeJob?Math.floor((now-activeJob.start)/(activeJob.end-activeJob.start)*100):0;
    return `<div class="card printer-card">
      <div class="card-top"><h3>${esc(p.name)}</h3><span class="tag ${tag}">${label}</span></div>
      <div class="card-value">${activeJob?progress+"%":status?"Kullanılamıyor":"Boşta"}</div>
      <p>${activeJob?"Aktif iş: "+esc(activeJob.name):status?"Not: "+esc(status.note||"Belirtilmedi"):"Şu anda aktif baskı yok"}</p>
      <p>${next?"Sonraki: "+esc(next.name)+" · "+fmtDateTime(new Date(next.start)):"Sıradaki iş yok"}</p>
      <button onclick="editPrinter(${p.id})">Adı Düzenle</button>
      <button onclick="setPrinterStatus(${p.id})">Durum Ayarla</button>
    </div>`;
  }).join("");
  $("savedJobsList").innerHTML=savedJobs.length?savedJobs.map(j=>`<div class="job-list-item"><span>${esc(j.name)}</span><span>${j.duration} sa</span></div>`).join(""):`<div class="empty">Kaydedilmiş iş yok.</div>`;
  $("activeJobsList").innerHTML=active.length?active.map(j=>`<div class="job-list-item"><span>${esc(j.name)}</span><span>${Math.floor((now-j.start)/(j.end-j.start)*100)}%</span></div>`).join(""):`<div class="empty">Aktif baskı yok.</div>`;
  $("completedJobsList").innerHTML=completed.length?completed.map(j=>`<div class="job-list-item"><span>${esc(j.name)}</span><span>Tamamlandı</span></div>`).join(""):`<div class="empty">Tamamlanan iş yok.</div>`;
}
function renderAll(){renderCalendar();renderDashboard();}
renderAll();
updateClock();
setInterval(()=>{updateClock();renderCalendar();renderDashboard();},60000);
window.addEventListener("resize",()=>{if($("calendarPage").classList.contains("active"))goToNow();});
setTimeout(goToNow,100);
</script>
</body>
</html>
