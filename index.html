<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>R4310 - PRINTFLOW 3D</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    font-family: Arial, Helvetica, sans-serif;
    background: #0f1720;
    color: #e8eef5;
    overflow: hidden;
}

button,
input,
select,
textarea {
    font: inherit;
}

/* =========================
   ANA YAPI
========================= */

.app {
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
}

.topbar {
    height: 62px;
    min-height: 62px;
    background: #151f2b;
    border-bottom: 1px solid #2b3948;
    display: flex;
    align-items: center;
    padding: 0 22px;
    justify-content: space-between;
}

.logo {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: .8px;
}

.nav {
    display: flex;
    gap: 8px;
}

.nav button {
    border: 0;
    background: transparent;
    color: #9eacba;
    padding: 10px 15px;
    border-radius: 7px;
    cursor: pointer;
}

.nav button:hover {
    background: #202d3c;
    color: white;
}

.nav button.active {
    background: #263748;
    color: white;
}

/* =========================
   EKRANLAR
========================= */

.page {
    display: none;
    width: 100%;
    height: calc(100vh - 62px);
}

.page.active {
    display: flex;
}

/* =========================
   TAKVİM
========================= */

.calendar-page {
    flex-direction: column;
}

.calendar-toolbar {
    height: 54px;
    min-height: 54px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 15px;
    background: #121c27;
    border-bottom: 1px solid #293847;
}

.calendar-title {
    font-size: 15px;
    font-weight: 600;
}

.calendar-controls {
    display: flex;
    align-items: center;
    gap: 7px;
}

.scale-btn {
    width: 32px;
    height: 32px;
    border: 1px solid #3a4b5d;
    background: #1b2937;
    color: white;
    border-radius: 6px;
    cursor: pointer;
    font-size: 20px;
}

.scale-btn:hover {
    background: #2a3a4b;
}

.scale-label {
    min-width: 70px;
    text-align: center;
    color: #91a0ae;
    font-size: 12px;
}

/* Takvim gövdesi */

.calendar-wrapper {
    flex: 1;
    overflow: auto;
    position: relative;
}

.calendar {
    position: relative;
    min-width: 2880px;
}

/* 1 gün = 24 saat.
   1 saat varsayılan 70px */
.calendar-header {
    height: 86px;
    display: flex;
    position: sticky;
    top: 0;
    z-index: 20;
    background: #18232f;
}

.corner {
    position: sticky;
    left: 0;
    z-index: 30;
    width: 210px;
    min-width: 210px;
    height: 86px;
    background: #18232f;
    border-right: 1px solid #344453;
    border-bottom: 1px solid #344453;
    overflow: hidden;
}

/*
   Sol üst alanı bilinçli olarak sade tutuyoruz.
   Çapraz çizgiyle iki alanı ayırıyoruz.
*/

.corner::after {
    content: "";
    position: absolute;
    left: -10%;
    top: 50%;
    width: 125%;
    height: 1px;
    background: #526170;
    transform: rotate(-45deg);
    transform-origin: center;
}

.corner-printers {
    position: absolute;
    bottom: 12px;
    left: 14px;
    font-size: 13px;
    font-weight: 700;
    color: #cdd8e3;
    z-index: 2;
}

.corner-time {
    position: absolute;
    right: 13px;
    top: 12px;
    font-size: 12px;
    color: #aab7c4;
    z-index: 2;
}

.timeline-header {
    display: flex;
    height: 86px;
}

.day-header {
    height: 86px;
    flex-shrink: 0;
    border-right: 1px solid #344453;
    background: #192532;
}

.day-name {
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 12px;
    border-bottom: 1px solid #30404f;
}

.day-date {
    height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #92a0ad;
    font-size: 11px;
}

.hours {
    display: flex;
    height: 32px;
}

.hour-header {
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-right: 1px solid #2c3b49;
    color: #82909e;
    font-size: 10px;
    flex-shrink: 0;
}

/* =========================
   YAZICI SATIRLARI
========================= */

.printer-row {
    display: flex;
    height: 72px;
}

.printer-name {
    position: sticky;
    left: 0;
    z-index: 15;
    width: 210px;
    min-width: 210px;
    height: 72px;
    background: #18232f;
    border-right: 1px solid #344453;
    border-bottom: 1px solid #2c3946;
    display: flex;
    align-items: center;
    padding: 0 13px;
    font-size: 12px;
}

.printer-name .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-right: 8px;
    background: #4ade80;
}

.timeline-row {
    position: relative;
    height: 72px;
    border-bottom: 1px solid #2c3946;
    display: flex;
}

/* saat kutuları */

.hour-cell {
    height: 72px;
    border-right: 1px solid #283744;
    flex-shrink: 0;
    position: relative;
}

/* Hafta içi 08-16 */

.hour-cell.work-hour {
    background: rgba(76, 175, 80, 0.055);
}

/* Hafta sonu */

.hour-cell.weekend {
    background: rgba(180, 180, 180, 0.055);
}

/* =========================
   ŞİMDİ ÇİZGİSİ
========================= */

.now-line {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 2px;
    background: #35e875;
    box-shadow: 0 0 7px rgba(53, 232, 117, .8);
    z-index: 12;
    pointer-events: none;
    animation: nowPulse 1.5s infinite;
}

@keyframes nowPulse {
    0%,100% {
        opacity: .65;
    }
    50% {
        opacity: 1;
    }
}

/* =========================
   İŞ BLOKLARI
========================= */

.job {
    position: absolute;
    top: 8px;
    height: 56px;
    border-radius: 7px;
    overflow: hidden;
    z-index: 8;
    border: 1px solid rgba(255,255,255,.15);
    cursor: pointer;
    background: #245d42;
}

.job:hover {
    z-index: 10;
    border-color: rgba(255,255,255,.4);
}

.job-inner {
    width: 100%;
    height: 100%;
    padding: 7px 8px;
    position: relative;
    overflow: hidden;
}

.job-name {
    font-size: 11px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;

    position: absolute;
    left: 8px;
    top: 20px;
}

.job-percent {
    position: absolute;
    right: calc(100% + 6px);
    top: 21px;
    font-size: 11px;
    font-weight: 700;
    color: #50ef8a;
    white-space: nowrap;
}

/*
   Baskı devam ediyorsa yeşil akan animasyon
*/

.job.printing::before {
    content: "";
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(
        90deg,
        transparent,
        rgba(71, 255, 138, .35),
        transparent
    );
    animation: printFlow 1.7s linear infinite;
}

@keyframes printFlow {
    from {
        left: -100%;
    }
    to {
        left: 100%;
    }
}

.job.completed {
    background: #31526a;
}

.job.planned {
    background: #31506a;
}

.job.fault {
    background: rgba(210, 70, 70, .25);
    border-color: rgba(240, 100, 100, .5);
}

.job.maintenance {
    background: rgba(230, 145, 50, .25);
    border-color: rgba(245, 165, 65, .5);
}

/* =========================
   DASHBOARD
========================= */

.dashboard-page {
    flex-direction: column;
    overflow: hidden;
}

.dashboard {
    padding: 18px;
    overflow: auto;
    height: 100%;
}

.dashboard-title {
    font-size: 20px;
    margin-bottom: 15px;
}

.dashboard-tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 18px;
    border-bottom: 1px solid #2c3a48;
    padding-bottom: 8px;
}

.dashboard-tabs button {
    border: 0;
    background: transparent;
    color: #91a0ae;
    padding: 9px 15px;
    border-radius: 6px;
    cursor: pointer;
}

.dashboard-tabs button:hover {
    background: #1e2c3a;
    color: white;
}

.dashboard-tabs button.active {
    background: #2b3c4d;
    color: white;
}

.dashboard-content {
    display: none;
}

.dashboard-content.active {
    display: block;
}

/* =========================
   YAZICI KARTLARI
========================= */

.printer-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
    gap: 15px;
}

.printer-card {
    background: #182430;
    border: 1px solid #2d3c4a;
    border-radius: 10px;
    padding: 15px;
}

.printer-card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
}

.printer-card-name {
    font-weight: 700;
}

.status {
    font-size: 11px;
    padding: 5px 8px;
    border-radius: 5px;
}

.status-idle {
    background: rgba(80, 200, 120, .15);
    color: #55df86;
}

.status-printing {
    background: rgba(80, 180, 240, .15);
    color: #65c9ff;
}

.status-fault {
    background: rgba(230, 80, 80, .15);
    color: #ff7a7a;
}

.status-maintenance {
    background: rgba(240, 160, 50, .15);
    color: #ffbd5b;
}

.progress-container {
    height: 8px;
    background: #273541;
    border-radius: 10px;
    overflow: hidden;
    margin: 9px 0;
}

.progress-bar {
    height: 100%;
    background: #43dc7a;
    border-radius: 10px;
}

.card-info {
    color: #9aa8b6;
    font-size: 12px;
    line-height: 1.7;
}

.next-job {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid #2b3946;
}

/* =========================
   BOŞTA
========================= */

.idle-card {
    margin-top: 18px;
    background: #182430;
    border: 1px solid #2d3c4a;
    border-radius: 10px;
    padding: 15px;
}

.idle-title {
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 10px;
}

.idle-printers {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

.idle-printer {
    background: rgba(70, 220, 120, .1);
    border: 1px solid rgba(70,220,120,.25);
    padding: 8px 11px;
    border-radius: 6px;
    color: #6ee796;
    font-size: 12px;
}

/* =========================
   LİSTELER
========================= */

.job-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 12px;
}

.list-item {
    background: #182430;
    border: 1px solid #2d3c4a;
    border-radius: 9px;
    padding: 13px;
}

.list-item-title {
    font-weight: 700;
    margin-bottom: 7px;
}

.list-item-info {
    font-size: 12px;
    color: #9ba9b6;
    line-height: 1.7;
}

/* =========================
   YÖNETİM
========================= */

.management {
    background: #182430;
    border: 1px solid #2d3c4a;
    border-radius: 10px;
    padding: 18px;
    margin-top: 18px;
}

.management h3 {
    margin-top: 0;
}

.management-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 10px;
}

input,
select,
textarea {
    width: 100%;
    background: #111b25;
    border: 1px solid #344555;
    color: white;
    padding: 9px;
    border-radius: 6px;
    outline: none;
}

textarea {
    min-height: 75px;
    resize: vertical;
}

input:focus,
select:focus,
textarea:focus {
    border-color: #50dc82;
}

.primary-btn {
    border: 0;
    background: #2fae60;
    color: white;
    padding: 10px 14px;
    border-radius: 6px;
    cursor: pointer;
}

.primary-btn:hover {
    background: #35c36c;
}

/* =========================
   MODAL
========================= */

.modal-bg {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.65);
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
}

.modal-bg.show {
    display: flex;
}

.modal {
    width: min(500px, 92vw);
    max-height: 90vh;
    overflow-y: auto;
    background: #17232f;
    border: 1px solid #344454;
    border-radius: 12px;
    padding: 20px;
}

.modal h2 {
    margin-top: 0;
}

.form-group {
    margin-bottom: 13px;
}

.form-group label {
    display: block;
    font-size: 12px;
    color: #a7b4c0;
    margin-bottom: 5px;
}

.modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 15px;
}

.secondary-btn {
    border: 1px solid #394a5b;
    background: #202f3d;
    color: white;
    padding: 9px 14px;
    border-radius: 6px;
    cursor: pointer;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width: 800px) {

    .topbar {
        padding: 0 10px;
    }

    .logo {
        font-size: 15px;
    }

    .nav button {
        padding: 8px;
        font-size: 11px;
    }

    .corner,
    .printer-name {
        width: 160px;
        min-width: 160px;
    }

    .corner-printers {
        left: 8px;
    }

    .corner-time {
        right: 8px;
    }
}
</style>
</head>

<body>

<div class="app">

<!-- =========================
     ÜST MENÜ
========================= -->

<header class="topbar">

    <div class="logo">
        R4310 - PRINTFLOW 3D
    </div>

    <nav class="nav">

        <button
            id="navCalendar"
            class="active"
            onclick="showPage('calendarPage')">
            Üretim Takvimi
        </button>

        <button
            id="navDashboard"
            onclick="showPage('dashboardPage')">
            Dashboard
        </button>

    </nav>

</header>


<!-- =========================
     ÜRETİM TAKVİMİ
========================= -->

<section
    id="calendarPage"
    class="page calendar-page active">

    <div class="calendar-toolbar">

        <div class="calendar-title">
            30 Günlük Üretim Takvimi
        </div>

        <div class="calendar-controls">

            <button
                class="scale-btn"
                onclick="changeScale(-1)">
                −
            </button>

            <div
                id="scaleLabel"
                class="scale-label">
                70 px/saat
            </div>

            <button
                class="scale-btn"
                onclick="changeScale(1)">
                +
            </button>

        </div>

    </div>

    <div
        id="calendarWrapper"
        class="calendar-wrapper">

        <div
            id="calendar"
            class="calendar">

            <div
                id="calendarHeader"
                class="calendar-header">

                <div class="corner">

                    <div class="corner-time">
                        TARİH / SAAT
                    </div>

                    <div class="corner-printers">
                        YAZICILAR
                    </div>

                </div>

                <div
                    id="timelineHeader"
                    class="timeline-header">
                </div>

            </div>

            <div
                id="calendarRows">
            </div>

        </div>

    </div>

</section>


<!-- =========================
     DASHBOARD
========================= -->

<section
    id="dashboardPage"
    class="page dashboard-page">

    <div class="dashboard">

        <div class="dashboard-title">
            Dashboard
        </div>

        <div class="dashboard-tabs">

            <button
                class="active"
                onclick="showDashboardTab('printersTab', this)">
                Yazıcılar
            </button>

            <button
                onclick="showDashboardTab('printingTab', this)">
                Baskıda
            </button>

            <button
                onclick="showDashboardTab('completedTab', this)">
                Tamamlanmış
            </button>

            <button
                onclick="showDashboardTab('plannedTab', this)">
                Basılacak
            </button>

        </div>


        <!-- YAZICILAR -->

        <div
            id="printersTab"
            class="dashboard-content active">

            <div
                id="printerGrid"
                class="printer-grid">
            </div>

            <div class="idle-card">

                <div class="idle-title">
                    Boşta Yazıcı
                </div>

                <div
                    id="idlePrinters"
                    class="idle-printers">
                </div>

            </div>


            <div class="management">

                <h3>Yazıcı Yönetimi</h3>

                <div
                    id="printerManagement"
                    class="management-grid">
                </div>

            </div>

        </div>


        <!-- BASKIDA -->

        <div
            id="printingTab"
            class="dashboard-content">

            <div
                id="printingList"
                class="job-list">
            </div>

        </div>


        <!-- TAMAMLANMIŞ -->

        <div
            id="completedTab"
            class="dashboard-content">

            <div
                id="completedList"
                class="job-list">
            </div>

        </div>


        <!-- BASILACAK -->

        <div
            id="plannedTab"
            class="dashboard-content">

            <div
                id="plannedList"
                class="job-list">
            </div>

        </div>

    </div>

</section>

</div>


<!-- =========================
     İŞ MODALI
========================= -->

<div
    id="jobModal"
    class="modal-bg">

    <div class="modal">

        <h2>Takvime İş Ekle</h2>

        <div class="form-group">

            <label>
                Yazıcı
            </label>

            <select
                id="jobPrinter">
            </select>

        </div>


        <div class="form-group">

            <label>
                Kayıtlı İş
            </label>

            <select
                id="savedJobSelect"
                onchange="selectSavedJob()">

                <option value="">
                    Yeni iş seç...
                </option>

            </select>

        </div>


        <div class="form-group">

            <label>
                Baskı Adı
            </label>

            <input
                id="jobName"
                type="text">

        </div>


        <div class="form-group">

            <label>
                Baskı Süresi (saat)
            </label>

            <input
                id="jobDuration"
                type="number"
                min="0.1"
                step="0.1">

        </div>


        <div class="form-group">

            <label>
                Baskıya Verme Tarihi
            </label>

            <input
                id="jobStart"
                type="datetime-local">

        </div>


        <div class="modal-actions">

            <button
                class="secondary-btn"
                onclick="closeModal('jobModal')">
                İptal
            </button>

            <button
                class="primary-btn"
                onclick="addJobToCalendar()">
                Takvime Ekle
            </button>

        </div>

    </div>

</div>


<!-- =========================
     KAYITLI İŞ MODALI
========================= -->

<div
    id="savedJobModal"
    class="modal-bg">

    <div class="modal">

        <h2>Kayıtlı İş Oluştur</h2>

        <p style="color:#94a3b0;font-size:12px;">
            Bu işlem yalnızca işi kaydeder.
            Takvime otomatik olarak eklenmez.
        </p>

        <div class="form-group">

            <label>
                Baskı Adı
            </label>

            <input
                id="savedName"
                type="text">

        </div>

        <div class="form-group">

            <label>
                Baskı Süresi (saat)
            </label>

            <input
                id="savedDuration"
                type="number"
                min="0.1"
                step="0.1">

        </div>

        <div class="modal-actions">

            <button
                class="secondary-btn"
                onclick="closeModal('savedJobModal')">
                İptal
            </button>

            <button
                class="primary-btn"
                onclick="saveJobTemplate()">
                Kaydet
            </button>

        </div>

    </div>

</div>


<!-- =========================
     ARIZA / BAKIM MODALI
========================= -->

<div
    id="statusModal"
    class="modal-bg">

    <div class="modal">

        <h2 id="statusModalTitle">
            Durum Kaydı
        </h2>

        <input
            id="statusPrinter"
            type="hidden">

        <input
            id="statusType"
            type="hidden">

        <div class="form-group">

            <label>
                Başlangıç
            </label>

            <input
                id="statusStart"
                type="datetime-local">

        </div>


        <div class="form-group">

            <label>
                Bitiş
            </label>

            <input
                id="statusEnd"
                type="datetime-local">

        </div>


        <div class="form-group">

            <label>
                Bitiş tarihi belli değilse boş bırakın
            </label>

        </div>


        <div class="form-group">

            <label>
                Not / Açıklama
            </label>

            <textarea
                id="statusNote"
                placeholder="Arıza veya bakım nedeni...">
            </textarea>

        </div>


        <div class="modal-actions">

            <button
                class="secondary-btn"
                onclick="closeModal('statusModal')">
                İptal
            </button>

            <button
                class="primary-btn"
                onclick="savePrinterStatus()">
                Kaydet
            </button>

        </div>

    </div>

</div>


<script>

/* =====================================================
   VERİ
===================================================== */

const printers = [
    { id: 1, name: "Yazıcı 1" },
    { id: 2, name: "Yazıcı 2" },
    { id: 3, name: "Yazıcı 3" },
    { id: 4, name: "Yazıcı 4" },
    { id: 5, name: "Yazıcı 5" },
    { id: 6, name: "Yazıcı 6" }
];

/* =====================================================
   TARİH
===================================================== */

function startOfDay(date) {

    const d = new Date(date);

    d.setHours(0,0,0,0);

    return d;
}


function formatDate(date) {

    return date.toLocaleDateString(
        "tr-TR",
        {
            day: "2-digit",
            month: "2-digit",
            year: "numeric"
        }
    );
}


function formatDateTime(date) {

    return date.toLocaleString(
        "tr-TR",
        {
            day: "2-digit",
            month: "2-digit",
            hour: "2-digit",
            minute: "2-digit"
        }
    );
}


/* =====================================================
   TAKVİM
===================================================== */

function getTimelineStart() {

    const d = startOfDay(new Date());

    return d;
}


function getDayCount() {

    return 30;
}


function renderCalendar() {

    const header =
        document.getElementById("timelineHeader");

    const rows =
        document.getElementById("calendarRows");

    header.innerHTML = "";
    rows.innerHTML = "";

    const start = getTimelineStart();

    const dayWidth = scale * 24;

    for (let d = 0; d < getDayCount(); d++) {

        const date = new Date(start);

        date.setDate(
            start.getDate() + d
        );

        const day =
            document.createElement("div");

        day.className = "day-header";

        day.style.width =
            dayWidth + "px";

        const dayName =
            date.toLocaleDateString(
                "tr-TR",
                {
                    weekday: "long"
                }
            );

        day.innerHTML = `
            <div class="day-name">
                ${dayName}
            </div>

            <div class="day-date">
                ${formatDate(date)}
            </div>

            <div class="hours">
                ${createHourHeaders(date)}
            </div>
        `;

        header.appendChild(day);
    }


    printers.forEach(printer => {

        const row =
            document.createElement("div");

        row.className =
            "printer-row";

        const name =
            document.createElement("div");

        name.className =
            "printer-name";

        name.innerHTML = `
            <span class="status-dot"></span>
            ${escapeHtml(printer.name)}
        `;

        row.appendChild(name);


        const timeline =
            document.createElement("div");

        timeline.className =
            "timeline-row";

        timeline.style.width =
            (dayWidth * getDayCount()) + "px";


        for (let d = 0; d < getDayCount(); d++) {

            const date = new Date(start);

            date.setDate(
                start.getDate() + d
            );

            for (let h = 0; h < 24; h++) {

                const cell =
                    document.createElement("div");

                cell.className =
                    "hour-cell";

                cell.style.width =
                    scale + "px";

                if (
                    date.getDay() !== 0 &&
                    date.getDay() !== 6 &&
                    h >= 8 &&
                    h < 16
                ) {

                    cell.classList.add(
                        "work-hour"
                    );
                }

                if (
                    date.getDay() === 0 ||
                    date.getDay() === 6
                ) {

                    cell.classList.add(
                        "weekend"
                    );
                }

                cell.dataset.printer =
                    printer.id;

                cell.dataset.date =
                    date.toISOString();

                cell.dataset.hour = h;

                cell.addEventListener(
                    "click",
                    () => openJobModal(
                        printer.id,
                        date,
                        h
                    )
                );

                timeline.appendChild(cell);
            }
        }


        /* ŞİMDİ ÇİZGİSİ */

        addNowLine(
            timeline,
            start,
            dayWidth
        );


        /* İŞLER */

        jobs
            .filter(job =>
                job.printerId === printer.id
            )
            .forEach(job => {

                renderJob(
                    timeline,
                    job,
                    start
                );
            });


        /* ARIZA / BAKIM */

        statuses
            .filter(status =>
                status.printerId === printer.id
            )
            .forEach(status => {

                renderStatus(
                    timeline,
                    status,
                    start
                );
            });


        row.appendChild(timeline);

        rows.appendChild(row);
    });


    document.getElementById("scaleLabel")
        .textContent =
        scale + " px/saat";
}


function createHourHeaders(date) {

    let html = "";

    for (let h = 0; h < 24; h++) {

        html += `
            <div
                class="hour-header"
                style="width:${scale}px">
                ${String(h).padStart(2,"0")}:00
            </div>
        `;
    }

    return html;
}


/* =====================================================
   ŞİMDİ ÇİZGİSİ
===================================================== */

function addNowLine(
    timeline,
    start,
    dayWidth
) {

    const now =
        new Date();

    const diff =
        now - start;

    if (diff < 0) return;

    const minutes =
        diff / 60000;

    const totalMinutes =
        30 * 24 * 60;

    if (minutes > totalMinutes)
        return;

    const left =
        (minutes / 60) * scale;

    const line =
        document.createElement("div");

    line.className =
        "now-line";

    line.style.left =
        left + "px";

    timeline.appendChild(line);
}


/* =====================================================
   İŞ ÇİZ
===================================================== */

function renderJob(
    timeline,
    job,
    calendarStart
) {

    const start =
        new Date(job.start);

    const end =
        new Date(
            start.getTime() +
            job.duration * 3600000
        );

    const minutesFromStart =
        (start - calendarStart) /
        60000;

    const durationMinutes =
        job.duration * 60;

    const left =
        minutesFromStart /
        60 *
        scale;

    const width =
        durationMinutes /
        60 *
        scale;


    if (
        width <= 0 ||
        left + width < 0 ||
        left > timeline.offsetWidth
    ) {
        return;
    }


    const block =
        document.createElement("div");

    block.className =
        "job";


    const now =
        new Date();

    if (
        now >= start &&
        now < end
    ) {

        block.classList.add(
            "printing"
        );
    }

    if (now >= end) {

        block.classList.add(
            "completed"
        );
    }

    block.style.left =
        left + "px";

    block.style.width =
        Math.max(width, 20) + "px";


    const percent =
        calculatePercent(
            start,
            end
        );


    block.innerHTML = `
        <div class="job-inner">

            ${
                percent > 0 &&
                percent < 100
                ?
                `<div class="job-percent">
                    %${percent}
                </div>`
                :
                ""
            }

            <div class="job-name">
                ${escapeHtml(job.name)}
            </div>

        </div>
    `;


    block.addEventListener(
        "click",
        event => {

            event.stopPropagation();

            openJobDetails(job);
        }
    );


    timeline.appendChild(block);
}


/* =====================================================
   YÜZDE
===================================================== */

function calculatePercent(
    start,
    end
) {

    const now =
        new Date();

    if (now <= start)
        return 0;

    if (now >= end)
        return 100;

    const total =
        end - start;

    const passed =
        now - start;

    return Math.floor(
        passed / total * 100
    );
}


/* =====================================================
   ARIZA / BAKIM ÇİZ
===================================================== */

function renderStatus(
    timeline,
    status,
    calendarStart
) {

    const start =
        new Date(status.start);

    const end =
        status.end
        ?
        new Date(status.end)
        :
        new Date(
            calendarStart.getTime() +
            30 * 24 * 3600000
        );


    const left =
        (start - calendarStart) /
        3600000 *
        scale;

    const width =
        (end - start) /
        3600000 *
        scale;


    const block =
        document.createElement("div");

    block.className =
        "job " +
        (
            status.type === "fault"
            ? "fault"
            : "maintenance"
        );


    block.style.left =
        left + "px";

    block.style.width =
        Math.max(width, 20) + "px";


    block.title =
        status.note || "";


    block.innerHTML = `
        <div class="job-inner">
            <div class="job-name">
                ${
                    status.type === "fault"
                    ? "ARIZALI"
                    : "BAKIMDA"
                }
            </div>
        </div>
    `;


    timeline.appendChild(block);
}

===================================================== */

function addJobToCalendar() {

    const printerId =
        Number(
            document.getElementById(
                "jobPrinter"
            ).value
        );

    const name =
        document.getElementById(
            "jobName"
        ).value.trim();

    const duration =
        Number(
            document.getElementById(
                "jobDuration"
            ).value
        );

    const start =
        new Date(
            document.getElementById(
                "jobStart"
            ).value
        );


    if (!name) {

        alert(
            "Baskı adı girin."
        );

        return;
    }

    if (
        !duration ||
        duration <= 0
    ) {

        alert(
            "Geçerli bir baskı süresi girin."
        );

        return;
    }


    if (
        isNaN(start.getTime())
    ) {

        alert(
            "Geçerli bir tarih girin."
        );

        return;
    }


    const end =
        new Date(
            start.getTime() +
            duration * 3600000
        );


    /* ARIZA / BAKIM */

    if (
        rangeBlocked(
            printerId,
            start,
            end
        )
    ) {

        alert(
            "Seçilen zaman aralığında yazıcı arızalı veya bakımda."
        );

        return;
    }


    /* İŞ ÇAKIŞMASI */

    const collision =
        jobs.some(existing => {

            if (
                existing.printerId !==
                printerId
            ) {
                return false;
            }

            const existingStart =
                new Date(
                    existing.start
                );

            const existingEnd =
                new Date(
                    existingStart.getTime() +
                    existing.duration *
                    3600000
                );

            return (
                start < existingEnd &&
                end > existingStart
            );
        });


    if (collision) {

        alert(
            "Bu yazıcıda seçilen saatlerde başka bir iş bulunuyor. İş çakışması nedeniyle eklenmedi."
        );

        return;
    }


    jobs.push({

        id:
            Date.now(),

        printerId,

        name,

        duration,

        start:
            start.toISOString()

    });


    closeModal(
        "jobModal"
    );

    renderCalendar();

    renderDashboard();
}


/* =====================================================
   YAZICI DURUM KONTROLÜ
===================================================== */

function printerHasBlockingStatus(
    printerId,
    date,
    hour
) {

    const start =
        new Date(date);

    start.setHours(
        hour,
        0,
        0,
        0
    );

    const end =
        new Date(
            start.getTime() +
            3600000
        );

    return rangeBlocked(
        printerId,
        start,
        end
    );
}


function rangeBlocked(
    printerId,
    start,
    end
) {

    return statuses.some(
        status => {

            if (
                status.printerId !==
                printerId
            ) {
                return false;
            }

            const statusStart =
                new Date(
                    status.start
                );

            const statusEnd =
                status.end
                ?
                new Date(status.end)
                :
                new Date(
                    "2999-12-31"
                );

            return (
                start < statusEnd &&
                end > statusStart
            );
        }
    );
}

function getPrinterJobs(
    printerId
) {

    return jobs
        .filter(
            job =>
                job.printerId ===
                printerId
        )
        .sort(
            (a,b) =>
                new Date(a.start) -
                new Date(b.start)
        );
}


function getCurrentJob(
    printerId
) {

    const now =
        new Date();

    return getPrinterJobs(
        printerId
    ).find(job => {

        const start =
            new Date(
                job.start
            );

        const end =
            new Date(
                start.getTime() +
                job.duration *
                3600000
            );

        return (
            now >= start &&
            now < end
        );
    });
}


function getNextJob(
    printerId
) {

    const now =
        new Date();

    return getPrinterJobs(
        printerId
    ).find(job => {

        const start =
            new Date(
                job.start
            );

        return start > now;
    });
}


function getPrinterStatus(
    printerId
) {

    const now =
        new Date();

    const status =
        statuses.find(s => {

            if (
                s.printerId !==
                printerId
            ) {
                return false;
            }

            const start =
                new Date(
                    s.start
                );

            const end =
                s.end
                ?
                new Date(s.end)
                :
                new Date(
                    "2999-12-31"
                );

            return (
                now >= start &&
                now < end
            );
        });

    if (status)
        return status.type;

    if (
        getCurrentJob(
            printerId
        )
    )
        return "printing";

    return "idle";
}

        container.innerHTML =
            `<div class="list-item">
                Planlanmış baskı yok.
            </div>`;
    }
}


/* =====================================================
   YAZICI YÖNETİMİ
===================================================== */

function renderPrinterManagement() {

    const container =
        document.getElementById(
            "printerManagement"
        );

    container.innerHTML = "";


    printers.forEach(
        printer => {

            const currentStatus =
                getPrinterStatus(
                    printer.id
                );


            const wrapper =
                document.createElement(
                    "div"
                );


            wrapper.innerHTML = `

                <div
                    style="
                        font-size:12px;
                        color:#a9b5c0;
                        margin-bottom:5px;">
                    ${escapeHtml(printer.name)}
                </div>

                <input
                    value="${escapeAttr(printer.name)}"
                    onchange="
                        renamePrinter(
                            ${printer.id},
                            this.value
                        )
                    ">

                <div
                    style="
                        display:flex;
                        gap:5px;
                        margin-top:6px;">

                    <button
                        class="secondary-btn"
                        onclick="
                            openStatusModal(
                                ${printer.id},
                                'fault'
                            )
                        ">
                        Arızalı
                    </button>

                    <button
                        class="secondary-btn"
                        onclick="
                            openStatusModal(
                                ${printer.id},
                                'maintenance'
                            )
                        ">
                        Bakımda
                    </button>

                </div>

                <div
                    style="
                        font-size:10px;
                        color:#748391;
                        margin-top:5px;">
                    Mevcut durum:
                    ${getStatusText(currentStatus)}
                </div>
            `;


            container.appendChild(
                wrapper
            );
        }
    );


    const addSaved =
        document.createElement(
            "div"
        );

    addSaved.innerHTML = `

        <div
            style="
                font-size:12px;
                color:#a9b5c0;
                margin-bottom:5px;">
            Kayıtlı İş
        </div>

        <button
            class="primary-btn"
            onclick="
                document
                .getElementById('savedJobModal')
                .classList.add('show')
            ">
            + Kayıtlı İş Oluştur
        </button>
    `;

    container.appendChild(
        addSaved
    );
}


function getStatusText(
    status
) {

    if (
        status === "printing"
    )
        return "Baskıda";

    if (
        status === "fault"
    )
        return "Arızalı";

    if (
        status === "maintenance"
    )
        return "Bakımda";

    return "Boşta";
}


function renamePrinter(
    id,
    name
) {

    name =
        name.trim();

    if (!name)
        return;

    const printer =
        printers.find(
            p => p.id === id
        );

    if (!printer)
        return;

    printer.name =
        name;

    renderCalendar();

    renderDashboard();
}


/* =====================================================
   DURUM MODALI
===================================================== */

function openStatusModal(
    printerId,
    type
) {

    document.getElementById(
        "statusPrinter"
    ).value =
        printerId;

    document.getElementById(
        "statusType"
    ).value =
        type;


    document.getElementById(
        "statusModalTitle"
    ).textContent =
        type === "fault"
        ?
        "Arıza Kaydı"
        :
        "Bakım Kaydı";


    const now =
        new Date();

    document.getElementById(
        "statusStart"
    ).value =
        toLocalDateTimeInput(
            now
        );

    document.getElementById(
        "statusEnd"
    ).value =
        "";

    document.getElementById(
        "statusNote"
    ).value =
        "";


    document
        .getElementById(
            "statusModal"
        )
        .classList.add("show");
}


function savePrinterStatus() {

    const printerId =
        Number(
            document.getElementById(
                "statusPrinter"
            ).value
        );

    const type =
        document.getElementById(
            "statusType"
        ).value;

    const start =
        new Date(
            document.getElementById(
                "statusStart"
            ).value
        );

    const endValue =
        document.getElementById(
            "statusEnd"
        ).value;

    const end =
        endValue
        ?
        new Date(endValue)
        :
        null;

    const note =
        document.getElementById(
            "statusNote"
        ).value.trim();


    if (
        isNaN(start.getTime())
    ) {

        alert(
            "Başlangıç tarihi geçersiz."
        );

        return;
    }


    if (
        end &&
        end <= start
    ) {

        alert(
            "Bitiş tarihi başlangıçtan sonra olmalıdır."
        );

        return;
    }


    statuses.push({

        id:
            Date.now(),

        printerId,

        type,

        start:
            start.toISOString(),

        end:
            end
            ?
            end.toISOString()
            :
            null,

        note

    });


    closeModal(
        "statusModal"
    );

    renderCalendar();

    renderDashboard();
}


/* =====================================================
   KAYITLI İŞ
===================================================== */

function saveJobTemplate() {

    const name =
        document.getElementById(
            "savedName"
        ).value.trim();

    const duration =
        Number(
            document.getElementById(
                "savedDuration"
            ).value
        );


    if (!name) {

        alert(
            "Baskı adı girin."
        );

        return;
    }


    if (
        !duration ||
        duration <= 0
    ) {

        alert(
            "Geçerli bir baskı süresi girin."
        );

        return;
    }


    savedJobs.push({

        id:
            Date.now(),

        name,

        duration

    });


    document.getElementById(
        "savedName"
    ).value = "";

    document.getElementById(
        "savedDuration"
    ).value = "";


    closeModal(
        "savedJobModal"
    );
}


/* =====================================================
   İŞ DETAY
===================================================== */

function openJobDetails(job) {

    const printer =
        printers.find(
            p =>
                p.id ===
                job.printerId
        );

    const start =
        new Date(
            job.start
        );

    const end =
        new Date(
            start.getTime() +
            job.duration *
            3600000
        );


    alert(
        "Baskı: " +
        job.name +
        "\n" +
        "Yazıcı: " +
        printer.name +
        "\n" +
        "Başlangıç: " +
        formatDateTime(start) +
        "\n" +
        "Bitiş: " +
        formatDateTime(end)
    );
}


/* =====================================================
   ÖLÇEK
===================================================== */

function changeScale(
    direction
) {

    scale +=
        direction * 10;

    scale =
        Math.max(
            MIN_SCALE,
            Math.min(
                MAX_SCALE,
                scale
            )
        );

    renderCalendar();
}


/* =====================================================
   MODAL
===================================================== */

function closeModal(
    id
) {

    document
        .getElementById(id)
        .classList.remove("show");
}


/* =====================================================
   YARDIMCI
===================================================== */

function populatePrinterSelect() {

    const select =
        document.getElementById(
            "jobPrinter"
        );

    select.innerHTML = "";

    printers.forEach(
        printer => {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                printer.id;

            option.textContent =
                printer.name;

            select.appendChild(
                option
            );
        }
    );
}


function toLocalDateTimeInput(
    date
) {

    const pad =
        n =>
        String(n)
            .padStart(2,"0");

    return (
        date.getFullYear() +
        "-" +
        pad(date.getMonth()+1) +
        "-" +
        pad(date.getDate()) +
        "T" +
        pad(date.getHours()) +
        ":" +
        pad(date.getMinutes())
    );
}


function escapeHtml(
    value
) {

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


function escapeAttr(
    value
) {

    return escapeHtml(value);
}


/* =====================================================
   BAŞLANGIÇ
===================================================== */

renderCalendar();

renderDashboard();


/* Takvim saati sürekli güncellensin */

setInterval(
    () => {

        renderCalendar();

        renderDashboard();

    },
    30000
);

</script>
